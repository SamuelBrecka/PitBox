server:
  port: ${PORT:8080}

spring:
  application:
    name: pitbox-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pitbox}
    username: ${DB_USER:pitbox}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

pitbox:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
